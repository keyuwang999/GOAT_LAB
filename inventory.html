<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Gallery of GOAT LAB: Research facilities, team building, and academic events at SEU Wuxi Campus.">
    <meta name="keywords" content="Zhang Group, Lab Photos, Team Building, SEU Wuxi, Scientific Gallery">
    <meta name="author" content="GOAT LAB">
    <!-- Open Graph / Facebook / WeChat -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://goatlab.seu.edu.cn/"> <!-- 如果以后有了域名，请填在这里 -->
    <meta property="og:title" content="GOAT LAB | Southeast University">
    <meta property="og:description" content="Prof. Qiubo Zhang's Group at SEU Wuxi Campus. Researching In-situ TEM, Atomic Manufacturing, and HEAs.">
    <meta property="og:image" content="images/news/lab_opening.jpg"> <!-- 建议放一张好看的实验室合影或Logo，路径要对 -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="GOAT LAB | Southeast University">
    <meta property="twitter:description" content="Genesis of Operando Atomic Thought (G.O.A.T) LAB.">
    <meta property="twitter:image" content="images/news/lab_opening.jpg">

    <title>Gallery | GOAT LAB</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/icon.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts (国内镜像加速) -->
    <link
        href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Navigation (Gallery 高亮) -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-light transition-all" id="mainNav">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="images/logo.svg" alt="Lab Logo" class="nav-logo me-2" loading="lazy">
                <div class="brand-text">
                    <span class="group-name d-none d-lg-block">Genesis of Operando Atomic Thought (G.O.A.T) LAB</span>
                    <span class="group-name d-block d-lg-none">G.O.A.T LAB</span>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-menu-container"><!-- JS 将会自动在这里生成菜单 --></ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header banner-inventory d-flex align-items-center"></header>

    <!-- Inventory Section -->
    <section class="py-section bg-light">
        <div class="container">
            <div class="mb-5 d-flex align-items-center" data-aos="fade-up">
                <div class="bg-seu-green me-3" style="width: 6px; height: 38px; border-radius: 2px;"></div>
                <h1 class="font-serif fw-bold m-0 display-5" style="color: #0e1d34;">实验室资产</h1>
            </div>
            <div class="row mb-5 align-items-center">
                <div class="col-lg-6 mb-3 mb-lg-0">
                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-outline-secondary inv-filter-btn active bg-seu-green text-white rounded-pill px-4" data-filter="all">全部</button>
                        <button class="btn btn-outline-secondary inv-filter-btn rounded-pill px-4" data-filter="equipment">仪器设备</button>
                        <button class="btn btn-outline-secondary inv-filter-btn rounded-pill px-4" data-filter="material">实验耗材</button>
                        <button class="btn btn-outline-secondary inv-filter-btn rounded-pill px-4" data-filter="tool">工具配件</button>
                        <button class="btn btn-outline-secondary inv-filter-btn rounded-pill px-4" data-filter="chemical">化学试剂</button>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-0"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="inventorySearch" class="form-control border-0 py-2" placeholder="按名称、编号或负责人搜索...">
                    </div>
                </div>
            </div>

            <div class="row" id="inventory-grid">
                <div class="col-12 text-center text-muted py-5">
                    <div class="spinner-border text-seu-green mb-3" role="status"></div>
                    <p>正在加载资产数据...</p>
                </div>
            </div>

            <nav aria-label="Asset page navigation" class="mt-4">
                <ul class="pagination justify-content-center" id="inventory-pagination-container"></ul>
            </nav>

        </div>
    </section>

    <footer class="bg-dark text-white py-5 mt-auto" id="global-footer">
        <!-- JS 将会自动加载页脚 -->
    </footer>
    
    <div class="modal fade" id="passwordModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-seu-green text-white border-0">
                    <h5 class="modal-title font-serif fw-bold"><i class="fas fa-lock me-2"></i>访问受限</h5>
                </div>
                <div class="modal-body p-4 text-center">
                    <p class="text-muted small mb-4">实验室资产清单仅限 G.O.A.T LAB 内部成员访问，请输入密码：</p>
                    <input type="password" id="inventoryPwdInput" class="form-control text-center mb-3" placeholder="请输入访问密码">
                    <div id="pwdErrorMsg" class="text-danger small fw-bold" style="display: none;">
                        <i class="fas fa-times-circle me-1"></i>密码错误，正在返回首页...
                    </div>
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" onclick="window.location.href='index.html'">取消并返回</button>
                    <button type="button" class="btn btn-seu-green rounded-pill px-4" id="verifyPwdBtn">确认进入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Back to Top Button -->
    <a href="#" id="back-to-top" class="btn btn-seu-green rounded-circle shadow back-to-top-btn" title="Back to Top">
        <i class="fas fa-arrow-up"></i>
    </a>

    <!-- Other Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <!-- 数据加载器 (必须放在 script.js 之前或之后均可，但建议放在这里) -->
    <script src="data-loader.js"></script>

    <!-- Custom Logic -->
    <script src="script.js"></script>

</body>

</html>
